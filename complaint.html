<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Complaint</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header>

        <div class="logo">
            <h2>SmartCity Connect</h2>
            <p>Municipal Complaint Management System</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="complaint.html">Complaint</a>
            <a href="track.html">Track Status</a>
            <a href="complaints.html">My Complaints</a>
        </nav>

    </header>


    <div class="page-title">

        <h1>Register a Complaint</h1>

        <p>
            Fill in the following details to register your complaint.
        </p>

    </div>


    <div class="form-container">

        <form>

            <label>Complaint Category</label>

            <select>

                <option>Select Category</option>
                <option>Road Damage</option>
                <option>Street Light</option>
                <option>Garbage</option>
                <option>Water Supply</option>
                <option>Drainage</option>

            </select>


            <label>Complaint Title</label>

            <input
                type="text"
                placeholder="Enter complaint title"
            >


            <label>Complaint Description</label>

            <textarea
                placeholder="Describe your problem"
            ></textarea>


            <label>Ward Number</label>

            <input
                type="text"
                placeholder="Enter ward number"
            >


            <label>Location</label>

            <input
                type="text"
                placeholder="Enter complaint location"
            >


            <label>Upload Image</label>

            <input type="file">


            <button type="submit">
                Submit Complaint
            </button>

        </form>

    </div>


</body>

</html>
