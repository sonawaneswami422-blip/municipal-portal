<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Complaint</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header>

        <div class="logo">

            <h2>SmartCity Connect</h2>

            <p>Municipal Complaint Management System</p>

        </div>


        <nav>

            <a href="index.html">Home</a>

            <a href="complaint.html">Complaint</a>

            <a href="track.html">Track Status</a>

            <a href="complaints.html">My Complaints</a>

        </nav>

    </header>


    <div class="page-title">

        <h1>Track Complaint</h1>

        <p>
            Enter your complaint ID to check the status.
        </p>

    </div>


    <div class="track-container">

        <input
            type="text"
            placeholder="Enter Complaint ID"
        >

        <button>
            Track Complaint
        </button>

    </div>


    <div class="status-container">

        <h2>Complaint Information</h2>

        <p><strong>Complaint ID:</strong> SC-1001</p>

        <p><strong>Category:</strong> Road Damage</p>

        <p><strong>Location:</strong> Ward 10</p>

        <p><strong>Status:</strong> In Progress</p>

    </div>


</body>

</html>
